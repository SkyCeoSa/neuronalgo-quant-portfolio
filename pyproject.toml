[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronalgo-quant-portfolio"
version = "0.1.0"
description = "Sanitized public research demos and engineering notes for NeuronAlgo."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy",
  "pandas",
]

[project.optional-dependencies]
qlib = [
  "pyqlib",
]

[tool.setuptools]
py-modules = []
